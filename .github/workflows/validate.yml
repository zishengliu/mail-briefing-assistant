name: Validate desktop assistant

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python source and tests
        run: python -m py_compile mail_briefing.py tests/test_mail_briefing.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check macOS installer shell syntax
        run: bash -n install_macos.sh
