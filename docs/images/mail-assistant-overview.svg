<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="780" viewBox="0 0 1280 780" role="img" aria-labelledby="title desc">
<title id="title">邮件助手产品界面示意图</title>
<desc id="desc">邮件助手桌面悬浮卡片，展示当日邮件总数、各邮箱新邮件数量、刷新按钮和邮件摘要列表。所有邮箱名称与邮件内容仅为示例。</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F1F6FF"/><stop offset=".54" stop-color="#F9FBFF"/><stop offset="1" stop-color="#EEF2FF"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5797FF"/><stop offset="1" stop-color="#2855E8"/></linearGradient>
  <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9A7BFF"/><stop offset="1" stop-color="#6443E8"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="15" stdDeviation="18" flood-color="#244A9A" flood-opacity=".13"/></filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#344F88" flood-opacity=".08"/></filter>
</defs>
<rect width="1280" height="780" rx="28" fill="url(#bg)"/>
<circle cx="1156" cy="94" r="112" fill="#DCE8FF" opacity=".45"/>
<circle cx="120" cy="735" r="165" fill="#DDF7EF" opacity=".48"/>
<path d="M0 610 C240 530 330 740 590 665 S1020 525 1280 620 V780 H0Z" fill="#FFFFFF" opacity=".52"/>
<!-- Intro -->
<g transform="translate(64 74)">
  <rect width="72" height="72" rx="22" fill="url(#blue)"/>
  <rect x="16" y="22" width="40" height="29" rx="6" fill="none" stroke="#FFFFFF" stroke-width="3"/>
  <path d="M18 25 L36 39 L54 25" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M53 48 L56 55 L63 58 L56 61 L53 68 L50 61 L43 58 L50 55Z" fill="#C5F8E3"/>
  <text x="94" y="35" fill="#142B57" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="36" font-weight="700">邮件助手</text>
  <text x="95" y="64" fill="#64779A" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15">Mail Briefing Assistant</text>
  <text x="0" y="128" fill="#152B53" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="31" font-weight="700">让重要邮件更容易被看见</text>
  <text x="0" y="164" fill="#536989" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17">多邮箱统一查看 · 按自然日统计 · 本地提醒</text>
  <g transform="translate(0 201)">
    <rect width="125" height="36" rx="18" fill="#E3EEFF"/>
