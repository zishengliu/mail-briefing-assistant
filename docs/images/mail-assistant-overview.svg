    <path d="M5 10h10M10 5v10" stroke="#2E5DCE" stroke-width="2" stroke-linecap="round"/>
    <text x="29" y="15" fill="#344D76" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14">Windows / macOS 桌面应用</text>
    <circle cx="10" cy="47" r="10" fill="#DDF8EC"/>
    <path d="M5 47l3 3 6-7" fill="none" stroke="#0B9665" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="29" y="52" fill="#344D76" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14">只读 IMAP，不发送或删除邮件</text>
