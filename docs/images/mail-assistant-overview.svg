    <rect x="137" width="129" height="36" rx="18" fill="#DDF8EC"/>
    <text x="201.5" y="23" text-anchor="middle" fill="#087A52" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" font-weight="600">每日邮件统计</text>
    <rect x="278" width="107" height="36" rx="18" fill="#FFF0D8"/>
